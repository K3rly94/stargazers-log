<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Open source trail</p>
        <h1>Stargazers log</h1>
        <p class="intro">A quiet record of the repositories worth keeping close.</p>
      </header>

      <section class="repository-section" aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span class="repository-count" id="repository-count">Loading...</span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status-message">Loading repositories...</p>
        </div>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
